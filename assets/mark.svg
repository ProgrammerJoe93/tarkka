<!--
  The Tarkka mark alone, on transparency, positioned exactly as in logo.svg.

  Used as the Android adaptive-icon foreground layer, where the background is
  supplied separately and launchers mask the result to their own shape. Keeping
  the geometry identical to the full tile means the mark lands inside the
  72dp-of-108dp safe zone without a second set of measurements.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g fill="#0e1015">
    <rect x="106" y="150" width="300" height="48" rx="24"/>
    <rect x="232" y="150" width="48" height="244" rx="24"/>
  </g>
</svg>
